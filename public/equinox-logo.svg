<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#8C6718" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlowLg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D1" stop-opacity="1"/>
      <stop offset="20%" stop-color="#FFD700" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGoldLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE8A6"/>
      <stop offset="28%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#9E751D"/>
      <stop offset="75%" stop-color="#DFB743"/>
      <stop offset="100%" stop-color="#7A560E"/>
    </linearGradient>
    <linearGradient id="needleGoldLg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="18%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="82%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#7A560E"/>
    </linearGradient>
    <linearGradient id="lineGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A560E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#7A560E" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="flareLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background radial warmth -->
  <rect width="500" height="420" fill="#000000"/>
  <circle cx="250" cy="150" r="160" fill="url(#bgGlow)"/>

  <!-- Center Glow -->
  <circle cx="250" cy="150" r="80" fill="url(#coreGlowLg)" opacity="0.75"/>

  <!-- Circular Ring -->
  <circle cx="250" cy="150" r="90" stroke="url(#ringGoldLg)" stroke-width="9.5" fill="none"/>
  <circle cx="250" cy="150" r="85" stroke="#FFF4C2" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>

  <!-- Needle Spire -->
  <polygon points="250,22 254.5,150 250,278 245.5,150" fill="url(#needleGoldLg)"/>

  <!-- Horizontal Sunburst Glint -->
  <polygon points="170,150 250,153 330,150 250,147" fill="#FFE899" opacity="0.85"/>

  <!-- Brilliant Center Flash -->
  <circle cx="250" cy="150" r="11" fill="#FFFFFF" filter="url(#flareLg)"/>
  <circle cx="250" cy="150" r="5.5" fill="#FFFFFF"/>

  <!-- Typography: EQUINOX -->
  <text x="250" y="338" font-family="'Geist', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="300" letter-spacing="0.38em" fill="#F6E7B8" text-anchor="middle">
    EQUINOX
  </text>

  <!-- Subtitle & Rules: THE SPORTS COMMUNE -->
  <line x1="70" y1="372" x2="150" y2="372" stroke="url(#lineGold)" stroke-width="1.8" stroke-linecap="round"/>
  <text x="250" y="376" font-family="'Geist', -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.32em" fill="#DFB743" text-anchor="middle">
    THE SPORTS COMMUNE
  </text>
  <line x1="350" y1="372" x2="430" y2="372" stroke="url(#lineGold)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
